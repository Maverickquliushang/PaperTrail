[project]
name = "papertrail"
version = "0.3.0"
description = "Local multi-source paper search"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "defusedxml>=0.7,<1",
    "python-dotenv>=1,<2",
    "lark-oapi>=1.4,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
cache_dir = ".cache/pytest"
