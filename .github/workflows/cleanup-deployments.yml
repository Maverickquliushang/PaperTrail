name: Remove obsolete deployment references
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-deployments.yml']
permissions:
  contents: write
  deployments: write
concurrency:
  group: papertrail-pages
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'Maverickquliushang/PaperTrail'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Delete deployment references outside the clean history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          gh api --paginate "repos/$GITHUB_REPOSITORY/deployments?per_page=100" \
            --jq '.[] | select(.environment == "github-pages") | [.id,.sha] | @tsv' > .tmp/deployments
          while IFS=$'\t' read -r id sha; do
            if git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$sha" HEAD; then
              echo "Preserved deployment $id from clean history"
              continue
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
              -f state=inactive -F auto_inactive=false > /dev/null
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/deployments/$id"
            echo "Removed obsolete deployment $id"
          done < .tmp/deployments
      - name: Remove completed maintenance workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-deployments.yml
          git commit -m 'Remove completed repository maintenance workflow'
          git push origin HEAD:main
