name: Update papers and deploy
on:
  workflow_dispatch:
  schedule:
    # UTC 01:00 = Asia/Shanghai 09:00. GitHub may delay scheduled jobs.
    - cron: '0 1 * * *'
    # Continue saved history pages; the collector skips when no resumable work remains.
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'code/web/**'
      - 'code/scripts/**'
      - 'code/config/catalog.json'
      - 'code/local/backend/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: papertrail-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: read
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
      - name: Migrate the existing public repository layout
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json,base64
          root=Path.cwd().resolve()
          if not (root/'code').exists():
              (root/'code').mkdir()
              for name in ['config','local','scripts','tests','web','package.json']:
                  source=(root/name).resolve(); target=(root/'code'/name).resolve()
                  assert source.is_relative_to(root) and target.is_relative_to(root)
                  assert source.exists() and not target.exists()
                  shutil.move(str(source),str(target))
              shutil.move(str(root/'code/local/docs'),str(root/'docs/local'))
              updates=json.loads(base64.b64decode(''))
              for name,content in updates.items():
                  target=(root/name).resolve()
                  assert target.is_relative_to(root) and '.github' not in target.relative_to(root).parts
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_text(content,encoding='utf-8')
              print('Moved public project to code/; applied',len(updates),'reviewed files')
          else:
              print('Layout already migrated')
          PY
      - name: Decide whether collection is needed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          collect=false
          if [ "$EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" HEAD -- scripts config local/backend | grep -q .; then
              collect=false
            fi
          fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install locked collector dependencies
        run: |
          python -m pip install uv==0.12.18
          uv sync --project local --locked
      - name: Verify behavior
        run: |
          npm test
          uv run --project local --locked python -m unittest discover -s tests -p 'test_*.py'
          cd local
          mkdir -p .tmp
          uv run --locked python -m pytest -q --basetemp .tmp/pytest
          cd frontend
          npm ci --no-fund --no-audit
          npm run build
      - name: Collect public metadata
        if: steps.changes.outputs.collect == 'true'
        env:
          PAPERTRAIL_BACKFILL_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule == '17 * * * *' }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: uv run --project local --locked python scripts/update_catalog.py
      - name: Preserve public catalog and recommendation history
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github'
          if ! git diff --cached --quiet; then
            git commit -m 'Organize both editions under code and add verified release records [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: code/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
