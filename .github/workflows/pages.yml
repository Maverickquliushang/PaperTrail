name: Update papers and deploy
on:
  workflow_dispatch:
  schedule:
    # UTC 01:00 = Asia/Shanghai 09:00. GitHub may delay scheduled jobs.
    - cron: '0 1 * * *'
    # Continue saved history pages; the collector skips when no resumable work remains.
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/**'
      - 'config/catalog.json'
      - 'local/backend/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: papertrail-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install locked collector dependencies
        run: |
          python -m pip install uv==0.12.18
          uv sync --project local --locked
      - name: Verify behavior
        run: |
          npm test
          uv run --project local --locked python -m unittest discover -s tests -p 'test_*.py'
      - name: Collect public metadata
        env:
          PAPERTRAIL_BACKFILL_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule == '17 * * * *' }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: uv run --project local --locked python scripts/update_catalog.py
      - name: Preserve public catalog and recommendation history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/catalog.json web/data/papers
          if ! git diff --cached --quiet; then
            git commit -m 'Update public paper catalog [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
